<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"Noto Sans Devanagari","Nirmala UI","Segoe UI",Tahoma,sans-serif;background:#fff7f7;color:#2b1b1b;line-height:1.7;overflow-x:hidden}
*{overflow-wrap:break-word}
.wrap{width:min(1180px,100% - 24px);margin-inline:auto}
h1,h2,h3{line-height:1.3}
h1{font-size:25px}
h2{font-size:20px;margin-bottom:6px}
h3{font-size:16px}
.lead{color:#6d5a5a;margin-bottom:14px;font-size:15px}
.small{font-size:12.5px;color:#7a6a6a}
.edit{background:#fff3cd;padding:2px 7px;border-radius:6px}
:root{--red:#b91c1c;--red-dark:#7f1d1d;--soft:#fdeaea;--line:#f0d5d5;--muted:#6d5a5a;--green:#15803d;--blue:#1d4ed8;--amber:#b45309}
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;position:relative}
.brand{display:flex;align-items:center;gap:8px;color:#2b1b1b;min-width:0}
.brand b{font-size:15px;display:block;line-height:1.25}
.brand small{font-size:11px;color:var(--muted)}
.logo{width:40px;height:40px;border-radius:50%;display:block;object-fit:cover;flex-shrink:0;background:#fff}
nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border-bottom:2px solid var(--line);flex-direction:column;padding:6px;box-shadow:0 12px 22px rgba(120,30,30,.14);max-height:72vh;overflow:auto;z-index:60}
nav.open{display:flex}
nav button{background:none;border:none;font:inherit;font-weight:700;color:#5b4444;padding:12px 10px;border-radius:9px;cursor:pointer;text-align:left;min-height:44px}
nav button:hover,nav button.on{background:var(--soft);color:var(--red)}
.menu-btn{display:block;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:19px;cursor:pointer;min-width:44px;min-height:44px}
.langbar{display:flex;align-items:center;gap:5px}
.langbar button{border:2px solid var(--red);background:#fff;color:var(--red);border-radius:999px;padding:6px 10px;font:inherit;font-weight:800;cursor:pointer;font-size:12px;min-height:36px}
.langbar button.on{background:var(--red);color:#fff}
.hero{background:radial-gradient(800px 340px at 85% -10%,#ffe1e1 0%,transparent 60%),linear-gradient(160deg,#fff,#fdeaea);padding:26px 0;border-bottom:1px solid var(--line)}
.hero-in{display:grid;grid-template-columns:1fr;gap:18px;align-items:center}
.tag{display:inline-block;background:#fff;border:1px solid var(--line);color:var(--red);padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700}
.hero h1{font-size:26px;margin:10px 0}
.hero h1 span{color:var(--red)}
.hero p{font-size:15px;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}
.quick button{border:2px solid var(--red);background:#fff;color:var(--red);border-radius:14px;padding:13px 10px;font:inherit;font-weight:800;cursor:pointer;min-height:48px}
.quick button:hover{background:var(--red);color:#fff}
.searchbar{display:flex;gap:8px;flex-direction:column;margin-top:13px}
.searchbar input,.searchbar select{width:100%;padding:12px;border:1px solid #dcc4c4;border-radius:11px;font:inherit;font-size:16px;background:#fff}
.searchbar button{padding:12px 18px;border:none;border-radius:11px;background:var(--red);color:#fff;font:inherit;font-weight:800;cursor:pointer;min-height:46px}
.hero-art{background:linear-gradient(140deg,#dc2626,#7f1d1d);border-radius:20px;padding:18px;color:#fff;text-align:center;box-shadow:0 14px 30px rgba(127,29,29,.25)}
.hero-art .big{font-size:44px}
.hero-art .line{display:flex;justify-content:space-around;font-size:12px;margin-top:6px}
.section{padding:26px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 4px 14px rgba(120,30,30,.05)}
.card .ic{font-size:26px}
.card p{font-size:13.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr;gap:11px;margin-top:12px}
.cards.three{grid-template-columns:1fr}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;border:2px solid var(--red);background:#fff;color:var(--red);padding:10px 15px;border-radius:11px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;min-height:44px;text-align:center}
.btn.red{background:var(--red);color:#fff}
.btn.green{border-color:var(--green);color:var(--green)}
.btn.block{width:100%;margin-top:6px}
.btn.sm{padding:7px 11px;font-size:13px;min-height:38px}
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.blood{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
.blood .g{font-size:17px;font-weight:900;color:var(--red)}
.blood .u{font-size:20px;font-weight:900;line-height:1.2}
.blood .s{font-size:11px;font-weight:700}
.ok{color:var(--green)}.low{color:var(--amber)}.out{color:var(--red)}
.blood-bar{height:5px;background:#f3e3e3;border-radius:6px;margin-top:4px;overflow:hidden}
.blood-bar i{display:block;height:100%;background:var(--red)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:11px}
table{border-collapse:collapse;width:100%;min-width:330px;font-size:13.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--red-dark)}
.form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(120,30,30,.07)}
.form h3{margin-bottom:9px}
.form label{display:block;font-size:13.5px;font-weight:700;margin-bottom:9px}
.form input,.form select,.form textarea{width:100%;margin-top:5px;padding:11px;border:1px solid #dcc4c4;border-radius:10px;font:inherit;font-size:16px;background:#fffdfd}
.two{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.msg{margin-top:9px;font-weight:700;font-size:13.5px;min-height:20px}
.msg.ok{color:var(--green)}.msg.no{color:#b91c1c}
.check{display:flex!important;gap:8px;align-items:center}
.check input{width:auto;margin:0;transform:scale(1.2)}
.donor{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:7px;flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f87171,#b91c1c);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.donor .info{flex:1 1 150px;font-size:13.5px;min-width:0}
.donor .btn,.donor .btn.sm{flex:0 0 auto}
.pill{display:inline-block;background:var(--soft);color:var(--red);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:800}
.story .q{font-size:14px;font-style:italic;color:#443}
.cal{display:grid;grid-template-columns:1fr;gap:11px;margin-top:12px}
.cal .day{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}
.cal .d{font-size:26px;font-weight:900;color:var(--red);line-height:1}
.faq{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;overflow:hidden}
.faq button{width:100%;text-align:left;background:none;border:none;font:inherit;font-weight:700;padding:13px 14px;cursor:pointer;color:#2b1b1b;min-height:44px}
.faq .a{padding:0 14px 12px;font-size:13.5px;color:var(--muted)}
.legal li{margin-bottom:7px}
.legal b{color:var(--red-dark)}
.alert{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:11px;font-size:13.5px;margin-top:10px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:11px}
.gcell{height:84px;border-radius:14px;display:grid;place-items:center;font-size:28px;border:1px solid var(--line)}
.map{height:150px;border:2px dashed #e5c6c6;border-radius:14px;display:grid;place-items:center;color:var(--muted);background:#fff;margin-top:11px;text-align:center;padding:10px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:11px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:19px;color:var(--red);word-break:break-all}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.tab{border:2px solid var(--red);background:#fff;color:var(--red);padding:8px 13px;border-radius:999px;font-weight:800;cursor:pointer;font-family:inherit;font-size:13px;min-height:40px;white-space:nowrap}
.tab.on{background:var(--red);color:#fff}
.footer{background:var(--red-dark);color:#fde4e4;padding:22px 0;margin-top:10px;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.footer-in{display:grid;grid-template-columns:1fr;gap:14px}
.footer b{color:#fff}
.footer p{font-size:13.5px}
.footer button{background:none;border:none;color:#fecaca;font:inherit;font-size:13.5px;cursor:pointer;padding:6px 4px;min-height:38px}
hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0}
.scroll-note{display:none}

/* ---------- tablet ---------- */
@media(min-width:640px){
  .wrap{width:min(1180px,100% - 32px)}
  h1{font-size:30px} h2{font-size:23px} h3{font-size:17px}
  .hero h1{font-size:32px} .hero p{font-size:16px}
  .quick{grid-template-columns:repeat(3,1fr);gap:11px}
  .cards,.cards.three{grid-template-columns:1fr 1fr}
  .cal{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .gallery{grid-template-columns:repeat(3,1fr)}
  .footer-in{grid-template-columns:1fr 1fr}
  .searchbar{flex-direction:row;flex-wrap:wrap}
  .searchbar input,.searchbar select{width:auto;flex:1 1 150px}
  .two{grid-template-columns:1fr 1fr}
  .donor{flex-wrap:nowrap}
  .gcell{height:100px;font-size:32px}
}

/* ---------- desktop ---------- */
@media(min-width:1024px){
  .wrap{width:min(1180px,100% - 40px)}
  .menu-btn{display:none}
  nav{display:flex;position:static;flex-direction:row;flex-wrap:wrap;gap:2px;padding:0;box-shadow:none;border:0;background:none;max-height:none;overflow:visible}
  nav button{padding:8px 10px;min-height:auto;text-align:center}
  .hero{padding:40px 0}
  .hero-in{grid-template-columns:1.2fr .8fr;gap:24px}
  .hero h1{font-size:36px}
  .hero p{font-size:17px}
  .quick{grid-template-columns:repeat(3,1fr);gap:12px}
  .hero-art .big{font-size:56px}
  .hero-art .line{font-size:13px}
  .section{padding:38px 0}
  h2{font-size:27px} h3{font-size:18px}
  .cards{grid-template-columns:repeat(4,1fr);gap:13px}
  .cards.three{grid-template-columns:repeat(3,1fr)}
  .inv-grid{grid-template-columns:repeat(8,1fr);gap:9px}
  .tiles{grid-template-columns:repeat(4,1fr);gap:11px}
  .cal{grid-template-columns:repeat(3,1fr)}
  .gallery{grid-template-columns:repeat(4,1fr);gap:11px}
  .footer-in{grid-template-columns:repeat(3,1fr)}
  .brand b{font-size:18px} .brand small{font-size:12px} .logo{width:48px;height:48px}
  .form{padding:17px}
  .form input,.form select,.form textarea{font-size:15px;padding:9px 11px}
  .searchbar input,.searchbar select{font-size:15px;padding:10px 12px}
  .map{height:160px}
}

/* ---------- bade phones landscape ---------- */
@media(max-width:1023px) and (min-width:640px){
  .nav{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="js/cloud.js"></script>
<script>
/* साझा डेटा (Firestore) पहले लाओ, फिर ऐप चलाओ — इससे हर फ़ोन/कंप्यूटर पर एक ही डेटा दिखता है */
(function () {
  function startApp() {
    var s = document.createElement('script');
    s.src = 'js/app.js';
    document.body.appendChild(s);
  }
  var started = false;
  function go() { if (started) return; started = true; startApp(); }
  if (window.BC_CLOUD && window.BC_CLOUD.boot) {
    try { window.BC_CLOUD.boot().then(go, go); } catch (e) { go(); }
    setTimeout(go, 4000);   /* हर हाल में ऐप खुले (धीमा नेटवर्क) */
  } else { startApp(); }
})();
</script>
<script>
// फ़ोन पर app की तरह चले + ऑफ़लाइन भी चले
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
  // नया version आते ही पेज दोबारा लोड (पुराना cache हट जाए)
  var reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (reloaded) return;
    reloaded = true;
    window.location.reload();
  });
}
</script>
</body>
